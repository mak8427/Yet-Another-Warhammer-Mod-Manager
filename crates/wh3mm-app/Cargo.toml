[package]
name = "wh3mm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri 2 desktop shell for Yet Another Warhammer Mod Manager"

[lib]
name = "wh3mm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wh3mm"
path = "src/main.rs"

[target.'cfg(any(windows, target_os = "linux"))'.build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wh3mm-core = { path = "../wh3mm-core" }
serde.workspace = true

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# custom-protocol makes cargo-built binaries use the embedded frontend instead
# of `devUrl`; this repository does not run the Tauri CLI dev server.
tauri = { version = "2", features = ["protocol-asset", "custom-protocol"] }
# Native save/open dialogs for profile share files. All file IO stays in the
# core commands; the plugin only returns the chosen path.
tauri-plugin-dialog = "2"

# Backs the blocking seam in tests; the desktop shell uses Tauri's runtime.
[dev-dependencies]
tokio = { version = "1", features = ["rt", "time"] }

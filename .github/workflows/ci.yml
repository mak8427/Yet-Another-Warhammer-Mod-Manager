name: CI

on:
  # The QA gate (docs/TESTING.md) must see every pushed branch and every PR.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      run_windows:
        description: 'Run the Windows Tauri build check'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache restore is best effort: bound the main step and fall back to a
      # cold build on failure. Post-step cleanup is bounded by the job timeout.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        continue-on-error: true

      # The workspace now compiles the Tauri shell on Linux, so the desktop
      # libraries must be present before any cargo command.
      #
      # apt can wait indefinitely on a stalled mirror or on the dpkg lock held
      # by unattended-upgrades on a fresh runner. Bound every network wait and
      # the whole step so a bad mirror fails fast instead of hanging.
      - name: Install Linux desktop dependencies
        timeout-minutes: 10
        run: |
          APT_OPTS=(
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::Retries=3
            -o DPkg::Lock::Timeout=120
          )
          sudo systemctl stop unattended-upgrades.service || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" update
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev

      - name: Release installer recipe tests
        run: python3 scripts/qa/install-recipes.test.py

      - name: Fixture integrity (committed + perf workloads)
        run: pnpm fixtures:verify

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The packaging guard reads the workflow files with the root `yaml`
      # dependency, so it runs after the workspace install.
      - name: Documentation links
        run: node scripts/qa/check-docs.mjs

      - name: QA generator guard tests
        timeout-minutes: 5
        run: pnpm qa:scripts

      # generate_context! embeds frontend/dist at compile time, so the frontend
      # must exist before clippy or tests build the app crate.
      - name: Build frontend
        run: pnpm build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Build Linux desktop binary
        run: cargo build -p wh3mm-app --release --locked

      # cargo does not enable Tauri's custom-protocol feature automatically.
      # Without it the WebView loads devUrl (localhost:1420) and the embedded
      # asset names never reach the binary, so a standalone start fails.
      - name: Verify production assets are embedded
        run: grep -a -q 'assets/index-' target/release/wh3mm

      - name: Stage Linux binary and checksum
        run: |
          mkdir -p dist
          tar -czf dist/wh3mm-linux-x64.tar.gz -C target/release wh3mm
          cd dist
          sha256sum wh3mm-linux-x64.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: wh3mm-linux-x64
          path: |
            dist/wh3mm-linux-x64.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  windows-tauri:
    name: Windows Tauri shell (manual until packaging)
    # The desktop shell builds on Windows and Linux (ADR-007); only the NSIS
    # release installer is Windows-only. This job is the manual Windows compile
    # check in M0; M5 promotes it to push/tag builds with an installer artifact.
    # Run it from workflow_dispatch with run_windows enabled. No rust-cache
    # here: its post-step upload has hung the job.
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build Tauri shell
        run: cargo build -p wh3mm-app --release

name: Linux packages

# Builds the Linux release artifacts. release.yml calls this on a v* tag or
# dispatch, and the pull_request/push triggers below run it directly when a
# change can affect a shipped Linux artifact, so AppImage, .deb, tarball, and
# the Arch package are proven before a release.
on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (X.Y.Z). Empty resolves from tauri.conf.json.'
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - .github/workflows/linux-packages.yml
      - .github/workflows/release.yml
      - .github/workflows/package-repositories.yml
      - scripts/qa/install-recipes.test.py
      - packaging/**
      - crates/**
      - frontend/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docs/RELEASE.md
  push:
    branches: ['**']
    paths:
      - .github/workflows/linux-packages.yml
      - .github/workflows/release.yml
      - .github/workflows/package-repositories.yml
      - scripts/qa/install-recipes.test.py
      - packaging/**
      - crates/**
      - frontend/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docs/RELEASE.md
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z). Empty resolves from tauri.conf.json.'
        required: false
        type: string
        default: ''

concurrency:
  group: linux-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bundles:
    name: Native packages and release recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The Tauri shell links WebKitGTK, and the bundler invokes patchelf.
      - name: Install Linux desktop and bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf rpm \
            libssl-dev \
            libdbus-1-dev

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version=$(node -p "require('./crates/wh3mm-app/tauri.conf.json').version")
          fi
          configured=$(node -p "require('./crates/wh3mm-app/tauri.conf.json').version")
          if [ "$version" != "$configured" ]; then
            echo "::error::version $version does not match tauri.conf.json $configured"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend gates
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build AppImage and Debian package
        working-directory: crates/wh3mm-app
        env:
          # linuxdeploy and appimagetool are AppImages themselves. Extracting
          # them keeps the build independent of FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx --yes @tauri-apps/cli@2.12.4 build --ci --bundles deb,appimage,rpm

      - name: Stage artifacts and checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          appimage=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          deb=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          rpm=$(find target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)
          if [ -z "$appimage" ] || [ -z "$deb" ] || [ -z "$rpm" ]; then
            echo "::error::Tauri did not produce the AppImage, .deb, and .rpm"
            find target/release/bundle -maxdepth 3 -type f || true
            exit 1
          fi

          cp "$appimage" "dist/wh3mm_${VERSION}_amd64.AppImage"
          cp "$deb" "dist/wh3mm_${VERSION}_amd64.deb"
          cp "$rpm" "dist/wh3mm-${VERSION}-1.x86_64.rpm"

          stage="dist/wh3mm-${VERSION}-linux-x86_64"
          mkdir -p "$stage"
          cp target/release/wh3mm "$stage/wh3mm"
          cp packaging/linux/wh3mm.desktop "$stage/wh3mm.desktop"
          cp crates/wh3mm-app/icons/128x128.png "$stage/wh3mm.png"
          tar -C dist -czf "dist/wh3mm-${VERSION}-linux-x86_64.tar.gz" "wh3mm-${VERSION}-linux-x86_64"
          rm -rf "$stage"

          python3 packaging/linux/render-recipes.py "$VERSION" "dist/wh3mm-${VERSION}-linux-x86_64.tar.gz" dist --repository "$GITHUB_REPOSITORY"
          cp packaging/linux/smoke-test.sh dist/smoke-test.sh

          cd dist
          sha256sum \
            "wh3mm_${VERSION}_amd64.AppImage" \
            "wh3mm_${VERSION}_amd64.deb" \
            "wh3mm-${VERSION}-linux-x86_64.tar.gz" \
            "wh3mm-${VERSION}-1.x86_64.rpm" \
            "wh3mm-nix-${VERSION}.tar.gz" \
            "wh3mm-gentoo-${VERSION}.tar.gz" >SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -lh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wh3mm-linux-${{ steps.version.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/smoke-test.sh
          if-no-files-found: error
          retention-days: 30

  ubuntu-24-04:
    name: Install and start on Ubuntu 24.04
    needs: bundles
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wh3mm-linux-${{ needs.bundles.outputs.version }}
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS.txt

      # The .deb declares its WebKitGTK/GTK dependencies; apt installs them.
      - name: Install the .deb and start the app
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends xvfb xdotool dbus dbus-x11 ca-certificates
          apt-get install -y ./dist/wh3mm_*_amd64.deb
          dpkg-query -W -f='${Package} ${Version}\n' wh3-mod-manager
          bash dist/smoke-test.sh /usr/bin/wh3mm

      # GTK/WebKit are already present from the .deb, so this exercises the
      # AppImage payload on the same clean base image. Containers have no
      # /dev/fuse, so smoke-test.sh uses the runtime's extract-and-run mode.
      - name: Run the AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(ls dist/*.AppImage)
          chmod +x "$appimage"
          bash dist/smoke-test.sh "$appimage"

  fedora:
    name: AppImage and tarball on Fedora
    needs: bundles
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wh3mm-linux-${{ needs.bundles.outputs.version }}
          path: dist

      - name: Install runtime dependencies and the smoke-test harness
        run: |
          dnf install -y \
            webkit2gtk4.1 \
            libayatana-appindicator-gtk3 \
            xorg-x11-server-Xvfb \
            xdotool \
            dbus-daemon

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Install the RPM and start the app
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y ./dist/*.rpm
          bash dist/smoke-test.sh /usr/bin/wh3mm

      - name: Run the tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/wh3mm
          tar -xzf dist/wh3mm-*-linux-x86_64.tar.gz -C /opt/wh3mm --strip-components=1
          bash dist/smoke-test.sh /opt/wh3mm/wh3mm

      - name: Run the AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(ls dist/*.AppImage)
          chmod +x "$appimage"
          bash dist/smoke-test.sh "$appimage"

  arch:
    name: Arch package (archlinux:latest)
    needs: bundles
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      # archlinux:latest is deliberately minimal; git must exist before
      # actions/checkout can run.
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git nodejs npm rust \
            webkit2gtk-4.1 libayatana-appindicator patchelf gtk3 librsvg \
            openssl dbus xorg-server-xvfb xdotool sudo shadow

      - uses: actions/checkout@v4

      # cargo tests include a read-only-directory fault-injection case that
      # root can bypass. Run the frontend and Rust gates as an unprivileged
      # builder so the tests keep their meaning inside the container.
      - name: Create non-root builder
        run: |
          id builder >/dev/null 2>&1 || useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install pnpm
        run: npm install --global pnpm@12.14.0

      - name: Toolchain versions
        run: |
          node --version
          rustc --version
          cargo --version
          pnpm --version

      - name: Install frontend dependencies
        run: sudo -u builder -H pnpm install --frozen-lockfile

      - name: Frontend gates
        run: |
          sudo -u builder -H pnpm typecheck
          sudo -u builder -H pnpm lint
          sudo -u builder -H pnpm test
          sudo -u builder -H pnpm build

      - name: Rust gates
        shell: bash
        run: |
          set -euo pipefail
          sudo -u builder -H bash -c 'test "$(id -u)" -ne 0'
          sudo -u builder -H cargo fmt --all --check
          sudo -u builder -H cargo clippy --workspace --all-targets --locked -- -D warnings
          sudo -u builder -H cargo test --workspace --locked
          sudo -u builder -H cargo build -p wh3mm-app --release --locked

      - uses: actions/download-artifact@v4
        with:
          name: wh3mm-linux-${{ needs.bundles.outputs.version }}
          path: artifacts

      - name: Build the Arch package
        env:
          VERSION: ${{ needs.bundles.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash packaging/arch/build-package.sh \
            "$VERSION" \
            "artifacts/wh3mm-${VERSION}-linux-x86_64.tar.gz" \
            packaging-out

      - name: Install the package and start the app
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(find packaging-out -maxdepth 1 -name 'wh3mm-bin-*.pkg.tar.zst' -print -quit)
          pacman -U --noconfirm "$pkg"
          pacman -Q wh3mm-bin
          test -x /usr/bin/wh3mm
          test -f /usr/share/applications/wh3mm.desktop
          bash artifacts/smoke-test.sh /usr/bin/wh3mm

      - name: Stage the package, PKGBUILD, and checksums
        shell: bash
        env:
          VERSION: ${{ needs.bundles.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p packaging-out/release
          cp packaging-out/wh3mm-bin-*.pkg.tar.zst packaging-out/release/
          cp packaging-out/aur/PKGBUILD packaging-out/release/PKGBUILD
          cp packaging-out/aur/.SRCINFO packaging-out/release/.SRCINFO
          cd packaging-out/release
          sha256sum wh3mm-bin-*.pkg.tar.zst >SHA256SUMS.arch.txt
          sha256sum -c SHA256SUMS.arch.txt
          ls -lh .

      # Artifact paths are flattened to packaging-out/release so the publish
      # job receives PKGBUILD and .SRCINFO at the release root. .SRCINFO is a
      # hidden file, so include-hidden-files is required.
      - name: Upload the Arch package
        uses: actions/upload-artifact@v4
        with:
          name: wh3mm-arch-${{ needs.bundles.outputs.version }}
          path: |
            packaging-out/release/*.pkg.tar.zst
            packaging-out/release/SHA256SUMS.arch.txt
            packaging-out/release/PKGBUILD
            packaging-out/release/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  opensuse:
    name: RPM on openSUSE Tumbleweed
    needs: bundles
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed:latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wh3mm-linux-${{ needs.bundles.outputs.version }}
          path: dist
      - name: Install the RPM and start the app
        shell: bash
        run: |
          set -euo pipefail
          zypper --non-interactive install -y xvfb-run xdotool dbus-1-daemon
          zypper --non-interactive --no-gpg-checks install -y ./dist/*.rpm
          bash dist/smoke-test.sh /usr/bin/wh3mm

  flatpak:
    name: Flatpak build and startup
    needs: bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wh3mm-linux-${{ needs.bundles.outputs.version }}
          path: dist
      - name: Install Flatpak tools and GNOME runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb xdotool dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Build and install the offline bundle
        run: |
          bash packaging/flatpak/build.sh dist/wh3mm-${{ needs.bundles.outputs.version }}-linux-x86_64.tar.gz flatpak-out
          flatpak install --user -y ./flatpak-out/wh3mm-linux-x86_64.flatpak
      - name: Check host access and start the app
        shell: bash
        run: |
          set -euo pipefail
          host_value=$(dbus-run-session -- flatpak run --command=flatpak-spawn com.warhammerlabs.wh3mm \
            --host --watch-bus '--env=WH3MM_HOST_TEST=value with spaces;literal' --directory="$HOME" \
            -- /usr/bin/printenv WH3MM_HOST_TEST)
          test "$host_value" = 'value with spaces;literal'
          cat > /tmp/wh3mm-flatpak-smoke <<'SH'
          #!/bin/sh
          exec flatpak run --env=GDK_BACKEND=x11 --env=WEBKIT_DISABLE_COMPOSITING_MODE=1 com.warhammerlabs.wh3mm
          SH
          chmod +x /tmp/wh3mm-flatpak-smoke
          bash packaging/linux/smoke-test.sh /tmp/wh3mm-flatpak-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: wh3mm-flatpak-${{ needs.bundles.outputs.version }}
          path: flatpak-out/*.flatpak
          if-no-files-found: error

  nix:
    name: Nix binary recipe and startup
    needs: bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wh3mm-linux-${{ needs.bundles.outputs.version }}
          path: dist
      - uses: cachix/install-nix-action@v31
      - name: Build against the exact local release tarball
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf dist/wh3mm-nix-${{ needs.bundles.outputs.version }}.tar.gz -C dist
          recipe=dist/wh3mm-nix-${{ needs.bundles.outputs.version }}
          # Seed the fixed-output cache: the draft release URL is not public yet.
          nix-prefetch-url file://"$PWD/dist/wh3mm-${{ needs.bundles.outputs.version }}-linux-x86_64.tar.gz"
          nix build "path:$PWD/$recipe#wh3mm" --out-link result
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool dbus-x11
          bash packaging/linux/smoke-test.sh "$PWD/result/bin/wh3mm"

  repositories:
    name: Signed repository integration
    needs: [bundles, arch, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wh3mm-*
          merge-multiple: true
          path: assets
      - name: Build repositories with a disposable test key
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm pacman-package-manager makepkg libarchive-tools flatpak ostree zstd xvfb xdotool dbus-x11
          export GNUPGHOME="$RUNNER_TEMP/test-signing"
          install -d -m700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --passphrase '' --quick-generate-key 'WH3MM disposable CI key' rsa3072 sign 1d
          SIGNING_KEY=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')
          export SIGNING_KEY
          export BASE_URL=https://example.invalid/wh3mm
          bash packaging/repositories/build.sh assets repository-out
          gpg --verify repository-out/apt/dists/stable/InRelease
          gpg --verify repository-out/rpm/repodata/repomd.xml.asc repository-out/rpm/repodata/repomd.xml
          gpg --verify repository-out/arch/x86_64/wh3mm.db.sig repository-out/arch/x86_64/wh3mm.db
          # Exercise apt dependency resolution and package selection through the
          # signed index, not through a direct .deb install.
          sudo install -m644 repository-out/repository-key.gpg /usr/share/keyrings/wh3mm-test.gpg
          echo "deb [signed-by=/usr/share/keyrings/wh3mm-test.gpg] file://$PWD/repository-out/apt stable main" | sudo tee /etc/apt/sources.list.d/wh3mm-test.list
          chmod -R a+rX repository-out
          sudo apt-get update
          sudo apt-get install -y wh3-mod-manager
          bash packaging/linux/smoke-test.sh /usr/bin/wh3mm
          flatpak remote-add --user --gpg-import=repository-out/repository-key.gpg wh3mm-test "file://$PWD/repository-out/flatpak"
          flatpak remote-info --user wh3mm-test com.warhammerlabs.wh3mm
      - name: Verify RPM package trust and dnf repository installation
        run: |
          docker run --rm -v "$PWD/repository-out:/repo:ro" fedora:latest bash -euc '
            rpm --import /repo/repository-key.asc
            rpm -Kv /repo/rpm/*.rpm
            printf "[wh3mm]\nname=WH3MM\nbaseurl=file:///repo/rpm\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=file:///repo/repository-key.asc\n" > /etc/yum.repos.d/wh3mm.repo
            dnf install -y wh3-mod-manager
            test -x /usr/bin/wh3mm
          '
      - name: Verify pacman database and package trust
        run: |
          docker run --rm -v "$PWD/repository-out:/repo:ro" archlinux:latest bash -euc '
            pacman-key --init
            pacman-key --populate archlinux
            pacman-key --add /repo/repository-key.asc
            pacman-key --lsign-key "$(cat /repo/KEY_FINGERPRINT.txt)"
            printf "\n[wh3mm]\nSigLevel = Required DatabaseRequired\nServer = file:///repo/arch/x86_64\n" >> /etc/pacman.conf
            pacman -Syu --noconfirm wh3mm-bin
            test -x /usr/bin/wh3mm
          '
      - name: Verify zypper repository installation
        run: |
          docker run --rm -v "$PWD/repository-out:/repo:ro" opensuse/tumbleweed:latest bash -euc '
            rpm --import /repo/repository-key.asc
            zypper --non-interactive addrepo --gpgcheck file:///repo/rpm wh3mm
            zypper --non-interactive refresh
            zypper --non-interactive install -y wh3-mod-manager
            test -x /usr/bin/wh3mm
          '

  gentoo:
    name: Gentoo Portage package installation
    needs: bundles
    runs-on: ubuntu-24.04
    container: gentoo/stage3:latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wh3mm-linux-${{ needs.bundles.outputs.version }}
          path: dist
      - name: Install the generated overlay with Portage
        shell: bash
        run: |
          set -euo pipefail
          emerge-webrsync
          mkdir -p /var/db/repos/wh3mm /var/cache/distfiles /etc/portage/repos.conf /etc/portage/package.accept_keywords
          tar -xzf dist/wh3mm-gentoo-${{ needs.bundles.outputs.version }}.tar.gz -C /var/db/repos/wh3mm --strip-components=1
          cp dist/wh3mm-${{ needs.bundles.outputs.version }}-linux-x86_64.tar.gz /var/cache/distfiles/
          printf '[wh3mm]\nlocation = /var/db/repos/wh3mm\nauto-sync = no\n' > /etc/portage/repos.conf/wh3mm.conf
          echo 'games-util/wh3mm-bin ~amd64' > /etc/portage/package.accept_keywords/wh3mm
          # Test Manifest verification and Portage install phases without a
          # multi-hour WebKit source build. Desktop dependencies/game launching
          # are a separate Gentoo manual QA requirement.
          emerge --oneshot --nodeps games-util/wh3mm-bin
          test -x /usr/bin/wh3mm
          test -f /usr/share/applications/wh3mm.desktop
          test -f /usr/share/icons/hicolor/128x128/apps/wh3mm.png

name: Perf legacy baseline

# Measures the official legacy WH3 Mod Manager release build against the synthetic 500-mod
# fixture. Windows-only: the legacy project ships a win32-x64 release and the app needs a
# desktop session. See docs/PERFORMANCE.md.
on:
  # workflow_dispatch only works once this file is on the default branch; the pull_request
  # trigger lets the job run on the branch that introduces it.
  pull_request:
    paths:
      - "scripts/perf/**"
      - ".github/workflows/perf-legacy-baseline.yml"
  workflow_dispatch:
    inputs:
      legacy_tag:
        description: Legacy release tag to measure
        required: true
        default: v2.29.0
      runs:
        description: Measured runs per metric
        required: true
        default: "12"

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the legacy release build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_TAG: ${{ inputs.legacy_tag || 'v2.29.0' }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\legacy" | Out-Null
          gh release download $env:LEGACY_TAG --repo Shazbot/WH3-Mod-Manager --dir "$env:RUNNER_TEMP\legacy"
          $zip = Get-ChildItem "$env:RUNNER_TEMP\legacy\*.zip" | Select-Object -First 1
          if (-not $zip) { throw "release asset zip not found" }
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\legacy\app" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\legacy\app" -Recurse -Filter "wh3mm.exe" | Select-Object -First 1
          if (-not $exe) { throw "wh3mm.exe not found in the release zip" }
          "WH3MM_APP=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "release asset: $($zip.Name) ($($zip.Length) bytes)"
          Write-Output "exe: $($exe.FullName)"

      - name: Generate and verify the 500-mod fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/perf/generate-fixture.mjs --out perf-fixture/wh3-500 --count 500
          if ($LASTEXITCODE -ne 0) { throw "fixture generation failed" }
          node scripts/perf/generate-fixture.mjs --verify perf-fixture/wh3-500
          if ($LASTEXITCODE -ne 0) { throw "fixture verification failed" }

      - name: Build the process-start stub
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found at $csc" }
          $src = Join-Path $env:RUNNER_TEMP "Wh3mmGameStub.cs"
          $source = @(
            'using System;',
            'using System.IO;',
            'using System.Threading;',
            '',
            'internal static class Wh3mmGameStub',
            '{',
            '    private static int Main(string[] args)',
            '    {',
            '        var marker = Environment.GetEnvironmentVariable("WH3MM_STUB_MARKER");',
            '        if (!string.IsNullOrEmpty(marker)) File.WriteAllText(marker, string.Join(Environment.NewLine, args));',
            '        Thread.Sleep(1500);',
            '        return 0;',
            '    }',
            '}'
          )
          $source | Set-Content -Path $src -Encoding UTF8
          $out = Join-Path $env:RUNNER_TEMP "Warhammer3.exe"
          & $csc /nologo /target:exe /out:$out $src
          if ($LASTEXITCODE -ne 0) { throw "csc failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw "stub was not produced" }
          "WH3MM_GAME_STUB=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "process-start stub: $out"

      - name: Measure the legacy release build
        shell: pwsh
        env:
          WH3MM_RUNS: ${{ inputs.runs || '12' }}
          WH3MM_APP: ${{ env.WH3MM_APP }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path docs/perf | Out-Null
          node scripts/perf/measure-legacy.mjs `
            --app "$env:WH3MM_APP" `
            --fixture perf-fixture/wh3-500 `
            --runs $env:WH3MM_RUNS `
            --out docs/perf/legacy-baseline.json
          if ($LASTEXITCODE -ne 0) { throw "legacy measurement failed" }

      - name: Attach the numbers to the run
        if: always()
        shell: pwsh
        run: |
          if (Test-Path docs/perf/legacy-baseline.json) {
            $report = Get-Content docs/perf/legacy-baseline.json -Raw | ConvertFrom-Json
            $lines = @(
              "### Legacy baseline (${{ inputs.legacy_tag || 'v2.29.0' }})",
              "Machine: $($report.environment.osRelease) / $($report.environment.cpu) / $($report.environment.cpuCores) cores / $($report.environment.totalMemoryGiB) GiB",
              "Fixture: $($report.environment.fixturePacks) packs, sha256 $($report.environment.fixtureSha256)",
              "Cold start median: $($report.metrics.coldStartMs.medianMs) ms (IQR $($report.metrics.coldStartMs.iqrMs) ms, n $($report.metrics.coldStartMs.n))",
              "Mod list populated median: $($report.metrics.modListPopulatedMs.medianMs) ms (IQR $($report.metrics.modListPopulatedMs.iqrMs) ms, n $($report.metrics.modListPopulatedMs.n))",
              "Header scan median: $($report.metrics.headerScanMs.medianMs) ms (IQR $($report.metrics.headerScanMs.iqrMs) ms, n $($report.metrics.headerScanMs.n))",
              "Load-order persist median: $($report.metrics.loadOrderPersistMs.medianMs) ms (IQR $($report.metrics.loadOrderPersistMs.iqrMs) ms, n $($report.metrics.loadOrderPersistMs.n))",
              "Preset switch median: $($report.metrics.presetSwitchMs.medianMs) ms (IQR $($report.metrics.presetSwitchMs.iqrMs) ms, n $($report.metrics.presetSwitchMs.n))",
              "Game launch handoff (proxy, stub process start): $($report.metrics.gameLaunchHandoffMs.medianMs) ms (IQR $($report.metrics.gameLaunchHandoffMs.iqrMs) ms, n $($report.metrics.gameLaunchHandoffMs.n))"
            )
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload raw logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-baseline-${{ inputs.legacy_tag || 'v2.29.0' }}
          path: |
            docs/perf/legacy-baseline.json
            docs/perf/.legacy-baseline-*/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

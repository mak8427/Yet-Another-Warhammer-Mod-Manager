name: Release

# Builds the Windows installer and the Linux packages, then creates a *draft*
# GitHub release with every artifact and one SHA256SUMS.txt. The draft release
# is audited before a human publishes it. A workflow_dispatch run builds the
# artifacts without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (must match tauri.conf.json)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows-installer:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          configured=$(node -p "require('./crates/wh3mm-app/tauri.conf.json').version")
          if [ "$version" != "$configured" ]; then
            echo "::error::version $version does not match tauri.conf.json $configured"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # generate_context! needs frontendDist on disk before the Windows crate
      # compiles, so build the frontend before the Rust tests.
      - name: Frontend gates
        shell: bash
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build installers
        working-directory: crates/wh3mm-app
        run: npx --yes @tauri-apps/cli@2.12.4 build --ci --bundles nsis

      # Stage flat so the checksum entry, the artifact entry, and the release
      # asset all use the same file name.
      - name: Stage installer and checksums
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/bundle/nsis/*.exe dist/
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wh3mm-windows-${{ env.VERSION }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  linux-packages:
    name: Linux packages
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: Draft release (all platforms)
    needs: [windows-installer, linux-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Every job uploads its own checksum file; collapse them into one index
      # for the release so a downloader can verify all assets at once.
      - name: Verify artifacts and build the release checksum index
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt SHA256SUMS.arch.txt smoke-test.sh
          ls -lh

          for pattern in '*.exe' '*.deb' '*.AppImage' '*.tar.gz' '*.pkg.tar.zst' '*.rpm' '*.flatpak'; do
            found=$(compgen -G "$pattern" || true)
            if [ -z "$found" ]; then
              echo "::error::missing release artifact matching $pattern"
              exit 1
            fi
          done
          test -f PKGBUILD
          test -f .SRCINFO

          sha256sum \
            *.exe *.deb *.AppImage *.tar.gz *.pkg.tar.zst *.rpm *.flatpak PKGBUILD .SRCINFO >SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "WH3 Mod Manager ${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG.md \
            dist/*.exe \
            dist/*.deb \
            dist/*.rpm \
            dist/*.flatpak \
            dist/*.AppImage \
            dist/*.tar.gz \
            dist/*.pkg.tar.zst \
            dist/PKGBUILD \
            dist/.SRCINFO \
            dist/SHA256SUMS.txt

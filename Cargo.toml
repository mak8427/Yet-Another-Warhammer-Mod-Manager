[workspace]
resolver = "2"
members = ["crates/wh3mm-core", "crates/wh3mm-app", "crates/wh3mm-perf"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

cut_scan:
  roots:
    - frontend/src
    - crates/wh3mm-app/src
    - crates/wh3mm-core/src/ipc.rs
  exclude_suffixes:
    - .test.ts
    - .test.tsx
    - .spec.ts
    - .spec.tsx
  features:
    - id: unit-viewer
      label: Unit viewer
      patterns: ['unit[ _-]?viewer']
    - id: unit-painter
      label: Unit painter
      patterns: ['unit[ _-]?painter']
    - id: node-graph
      label: Node graph editor
      patterns: ['node[ _-]?graph']
    - id: tech-tree
      label: Tech tree
      patterns: ['tech[ _-]?tree']
    - id: skill-tree
      label: Skill tree
      patterns: ['skill[ _-]?tree']
    - id: db-clone
      label: DB clone
      patterns: ['db[ _-]?clone']
    - id: esf-map
      label: ESF map renderer
      patterns: ['esf[ _-]?map']
    - id: campaign-map
      label: Campaign map renderer
      patterns: ['campaign[ _-]?map']
    - id: pack-editor
      label: Pack file editor
      patterns: ['pack[ _-]?(file[ _-]?)?editor', 'rpfm', 'native[ _-]?patch']
    - id: compression-analysis
      label: Compression analysis
      patterns: ['compression[ _-]?analysis']
    - id: model-viewer
      label: 3D or texture viewer
      patterns: ['model[ _-]?viewer', 'texture[ _-]?preview', 'ktx2']
    - id: three-js
      label: Three.js asset host
      patterns: ['three\.js', 'threejs', "from ['\"]three['\"]"]
    - id: code-editor
      label: Code or localisation editor
      patterns: ['code[ _-]?mirror', 'locali[sz]ation[ _-]?editor']
    - id: legacy-shell
      label: Electron or legacy frontend stack
      patterns: ['electron', 'webpack', 'flowbite', 'joyride', 'redux', 'react-router']
    - id: non-wh3-games
      label: Non-WH3 game support
      patterns:
        - 'warhammer[ _-]?2'
        - '\bwh2\b'
        - 'three[ _-]?kingdoms'
        - '\btroy\b'
        - '\bpharaoh\b'
        - '\battila\b'
        - 'rome[ _-]?ii'
        - 'shogun[ _-]?2'
        - '\bnapoleon\b'
        - 'thrones[ _-]?of[ _-]?britannia'
    - id: telemetry-accounts
      label: Telemetry, accounts, or auto-update
      patterns: ['telemetry', 'auto[ _-]?update', 'account[ _-]?system', 'steam[ _-]?login']

